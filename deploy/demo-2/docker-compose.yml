# Monitoring stack demo-2 cho môi trường server (khác bản chạy local ở demo-2/monitoring/).
#
#   http://demo-2.9ping.cloud:8082/   -> Grafana, anonymous Viewer (học viên chỉ xem)
#
# Chỉ Grafana publish ra ngoài, ở cổng 8082 — KHÔNG đi qua Traefik, không đụng cổng 80/443.
# Prometheus và snmp-exporter chỉ nghe trong mạng nội bộ, không publish (firewall server
# đang inactive nên mọi cổng publish đều lộ thẳng ra Internet).
#
# Mạng demo2-mgmt do containerlab tạo khi deploy network-monitoring.clab.yml.
#
# Xem Prometheus khi cần: ssh -L 9090:localhost:9090 ... rồi
#   docker compose -f deploy/demo-2/docker-compose.yml exec prometheus wget -qO- localhost:9090/-/healthy

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: demo2-prometheus
    restart: unless-stopped
    volumes:
      - ../../demo-2/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - demo2-mgmt

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: demo2-snmp-exporter
    restart: unless-stopped
    volumes:
      - ../../demo-2/monitoring/snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    networks:
      - demo2-mgmt

  grafana:
    image: grafana/grafana:11.3.0
    container_name: demo2-grafana
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      # Bắt buộc đặt trong deploy/.env — không hardcode mật khẩu trên máy công khai Internet.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?dat GF_ADMIN_PASSWORD trong deploy/.env}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=http://demo-2.9ping.cloud:8082/
      - GF_USERS_DEFAULT_THEME=dark
      # Học viên mở URL gốc là thấy ngay dashboard, không phải bấm tìm.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/network-monitoring.json
      # Học viên chỉ xem: ẩn nút đăng nhập và tắt đăng ký.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../demo-2/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../demo-2/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - demo2-mgmt

networks:
  demo2-mgmt:
    external: true
