# snmpd.conf cho edge-gw (demo giám sát mạng)
# Community "public", read-only, mở toàn bộ OID cho lab nội bộ (KHÔNG dùng ngoài môi trường demo).

agentAddress udp:161

com2sec readonly default public
group ROGroup v2c readonly
view allview included .1
access ROGroup "" any noauth exact allview none none

# Đảm bảo hrStorageTable (RAM + tất cả filesystem) được populate đầy đủ cho HOST-RESOURCES-MIB.
includeAllDisks 10

sysLocation Demo Lab - edge-gw
sysContact demo@kai-networks-demo
